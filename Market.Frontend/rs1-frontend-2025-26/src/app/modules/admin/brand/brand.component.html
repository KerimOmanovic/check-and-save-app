<section class="admin-page">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <div class="logo">
          <span class="logo-mark">CS</span>
          <span class="logo-text">Check&Save</span>
        </div>
        <div class="topbar-links">
          <span class="link">Kategorije Proizvoda</span>
          <span class="link is-active">Brendovi</span>
          <span class="link">Proizvodi</span>
        </div>
      </div>
      <div class="topbar-right">
        <mat-form-field class="search-field" appearance="outline">
          <mat-label>Pretraži brendove</mat-label>
          <input matInput [formControl]="searchControl" placeholder="npr. Samsung, Apple…" />
          <button mat-icon-button matSuffix type="button" *ngIf="searchControl.value" (click)="clearSearch()">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
        <button mat-raised-button class="btn-add" type="button" (click)="goToAddBrand()">
          <mat-icon>add</mat-icon>
          Novi Brend
        </button>
      </div>
    </div>
  </header>

  <div class="content-full">
    <mat-card class="brands-card">
      <div class="section-head">
        <div class="titles">
          <h1>Brendovi</h1>
          <p>Upravljanje brendovima proizvoda</p>
        </div>
        <div class="badges">
          <span class="badge" *ngIf="isLoading">Loading…</span>
          <span class="badge badge-error" *ngIf="!isLoading && errorMessage">{{ errorMessage }}</span>
          <span class="badge badge-count" *ngIf="!isLoading && !errorMessage">{{ filteredBrands.length }}</span>
        </div>
      </div>

      <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

      <div class="grid" *ngIf="!isLoading && !errorMessage">
        <ng-container *ngIf="filteredBrands.length > 0; else emptyState">
          <mat-card class="brand-card" *ngFor="let brand of filteredBrands">
            <div class="brand-top">
              <div class="brand-icon">{{ (brand.name || '?').slice(0, 1) | uppercase }}</div>
              <div class="brand-meta">
                <div class="brand-name">{{ brand.name }}</div>
                <div class="brand-desc">{{ brand.description || '-' }}</div>
              </div>
            </div>
            <div class="brand-actions">
              <button mat-stroked-button class="btn-outline" type="button" (click)="goToEditBrand(brand.id)">
                <mat-icon>edit</mat-icon>
                Uredi
              </button>
              <button mat-stroked-button class="btn-outline-danger" type="button" (click)="deleteBrand(brand)">
                <mat-icon>delete</mat-icon>
                Obriši
              </button>
            </div>
          </mat-card>
        </ng-container>
        <ng-template #emptyState>
          <div class="empty-state">Nema brendova za prikaz.</div>
        </ng-template>
      </div>
    </mat-card>
  </div>
</section>
