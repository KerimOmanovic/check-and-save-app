<div class="container">
  <!-- Header card -->
  <div class="header-card">
    <h1>Dodaj kategoriju</h1>
  </div>

  <!-- Form card -->
  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Error banner -->
      <div *ngIf="errorMessage" class="error-banner">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Loading overlay -->
      <div *ngIf="isLoading" class="loading-overlay">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Čuvanje podataka...</p>
      </div>

      <!-- Category name -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Naziv kategorije *</mat-label>
        <input
          matInput
          formControlName="name"
          placeholder="npr. Televizori, Mobiteli"
        />
        <mat-icon matSuffix>category</mat-icon>

        <mat-error *ngIf="hasError('name')">
          {{ getErrorMessage('name') }}
        </mat-error>
      </mat-form-field>

      <!-- Category description (optional) -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Opis</mat-label>
        <textarea
          matInput
          rows="5"
          formControlName="description"
          placeholder="Unesite opis kategorije (opcionalno)"
        ></textarea>
        <mat-icon matSuffix>notes</mat-icon>

        <mat-error *ngIf="hasError('description')">
          {{ getErrorMessage('description') }}
        </mat-error>
      </mat-form-field>

      <!-- Actions -->
      <div class="form-actions">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
          [disabled]="isLoading"
        >
          <mat-icon>close</mat-icon>
          Otkaži
        </button>

        <button
          type="submit"
          mat-raised-button
          [disabled]="form.invalid || isLoading"
        >
          <mat-icon>save</mat-icon>
          Sačuvaj
        </button>
      </div>
    </form>
  </div>
</div>
