<div *ngIf="isLoading">Loading...</div>
<div *ngIf="!isLoading && errorMessage">{{ errorMessage }}</div>

<table *ngIf="!isLoading && !errorMessage">
  <thead>
  <tr>
    <th>Id</th>
    <th>Name</th>
    <th>Description</th>
  </tr>
  </thead>

  <tbody>
  <tr *ngFor="let category of categories">
    <td>{{ category.id }}</td>
    <td>{{ category.name }}</td>
    <td>{{ category.description }}</td>
  </tr>
  </tbody>
</table>
