<section class="admin-page">
  <header class="topbar">
    <div class="topbar-inner">

      <div class="topbar-left">
        <div class="logo">
          <span class="logo-mark">CS</span>
          <span class="logo-text">Check&Save</span>
        </div>
        <div class="topbar-links">
          <span class="link is-active">Product Categories</span>
          <span class="link" routerLink="/admin/brands">Brands</span>
          <span class="link" routerLink="/admin/branches">Branches</span>
          <span class="link" routerLink="/admin/products">Products</span>
          <span class="link" routerLink="/admin/cities">Cities</span>
          <span class="link" routerLink="/admin/stores">Stores</span>
        </div>
      </div>

      <div class="topbar-right">

        <div class="field-wrapper">
          <label class="topbar-label">Search Categories</label>
          <mat-form-field class="search-field" appearance="outline">
            <input matInput placeholder="Enter category name..."
                   (keyup.enter)="onSearch()" [(ngModel)]="request.search" />
            <button mat-icon-button matSuffix type="button"
                    *ngIf="request.search" (click)="clearSearch()" aria-label="Clear search">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
        </div>

        <div class="btn-wrapper">
          <button mat-raised-button class="btn-add" type="button" (click)="onCreate()">
            <mat-icon>add</mat-icon> New Category
          </button>
        </div>

      </div>
    </div>
  </header>

  <div class="content">
    <div *ngIf="isLoading" class="loading-state">
      <mat-spinner diameter="50"></mat-spinner>
      <p>Loading...</p>
    </div>

    <div *ngIf="!isLoading && errorMessage" class="error-state">
      <mat-icon>error_outline</mat-icon>
      <p>{{ errorMessage }}</p>
    </div>

    <div class="table-card" *ngIf="!isLoading && !errorMessage">
      <table mat-table [dataSource]="items">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let category">
            <span class="name-cell">{{ category.name }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let category">{{ category.description || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let category">
            <div class="action-buttons">
              <button mat-icon-button class="btn-edit" (click)="onEdit(category)" matTooltip="Edit category">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button class="btn-delete" (click)="onDelete(category)" matTooltip="Delete category">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row no-data-row" *matNoDataRow>
          <td class="mat-cell" colspan="3">
            <div class="no-data-message">
              <mat-icon>info_outline</mat-icon>
              <ng-container *ngIf="request.search; else noDataDefault">
                No results for the search term.
              </ng-container>
              <ng-template #noDataDefault>No categories found.</ng-template>
            </div>
          </td>
        </tr>
      </table>

      <app-fit-paginator-bar [vm]="this" />
    </div>
  </div>
</section>
