<div class="forgot-container">
  <h2 class="forgot-title">Zaboravljena lozinka</h2>

  <p class="forgot-subtitle">
    Unesi svoju email adresu i poslat ćemo ti link za resetovanje lozinke.
  </p>

  <form class="forgot-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email adresa</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="npr. ime.prezime@email.com"
        [class.invalid]="email.invalid && (email.dirty || email.touched)"
        autocomplete="email"
      />

      <div class="error" *ngIf="email.invalid && (email.dirty || email.touched)">
        <span *ngIf="email.errors?.['required']">Email je obavezan.</span>
        <span *ngIf="email.errors?.['email']">Unesi ispravan email.</span>
      </div>
    </div>

    <button class="submit-btn" type="submit" [disabled]="form.invalid || isSubmitting">
      {{ isSubmitting ? 'Slanje...' : 'Pošalji link za reset' }}
    </button>

    <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
  </form>

  <div class="back-link">
    <a routerLink="/login">Nazad na prijavu</a>
  </div>
</div>
