<section class="admin-page">
  <header class="topbar">
    <div class="topbar-inner">

      <div class="topbar-left">
        <div class="logo">
          <span class="logo-mark">CS</span>
          <span class="logo-text">Check&Save</span>
        </div>
        <div class="topbar-links">
          <span class="link" routerLink="/admin/categories">Kategorije</span>
          <span class="link is-active">Brendovi</span>
          <span class="link" routerLink="/admin/stores">Prodavnice</span>
          <span class="link" routerLink="/admin/branches">Poslovnice</span>
          <span class="link" routerLink="/admin/cities">Gradovi</span>
          <span class="link" routerLink="/admin/products">Proizvodi</span>
        </div>
      </div>

      <div class="topbar-right">
        <div class="field-wrapper">
          <label class="topbar-label">Pretraga brendova</label>
          <mat-form-field class="search-field" appearance="outline">
            <input matInput placeholder="Naziv brenda..."
                   (keyup.enter)="onSearch()" [(ngModel)]="request.search" />
            <button mat-icon-button matSuffix type="button"
                    *ngIf="request.search" (click)="clearSearch()" aria-label="Očisti pretragu">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
        </div>

        <div class="btn-wrapper">
          <div class="btn-spacer"></div>
          <button mat-raised-button class="btn-add" type="button" (click)="onCreate()">
            <mat-icon>add</mat-icon> Novi brend
          </button>
        </div>
      </div>

    </div>
  </header>

  <div class="content">
    <div *ngIf="isLoading" class="loading-state">
      <mat-spinner diameter="50"></mat-spinner>
      <p>Učitavanje...</p>
    </div>

    <div *ngIf="!isLoading && errorMessage" class="error-state">
      <mat-icon>error_outline</mat-icon>
      <p>{{ errorMessage }}</p>
    </div>

    <div class="table-card" *ngIf="!isLoading && !errorMessage">
      <table mat-table [dataSource]="items">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Naziv</th>
          <td mat-cell *matCellDef="let brand">
            <span class="name-cell">{{ brand.name }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Opis</th>
          <td mat-cell *matCellDef="let brand">{{ brand.description || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Akcije</th>
          <td mat-cell *matCellDef="let brand">
            <div class="action-buttons">
              <button mat-icon-button class="btn-edit" (click)="onEdit(brand)" matTooltip="Uredi brend">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button class="btn-delete" (click)="onDelete(brand)" matTooltip="Obriši brend">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row no-data-row" *matNoDataRow>
          <td class="mat-cell" colspan="3">
            <div class="no-data-message">
              <mat-icon>info_outline</mat-icon>
              <ng-container *ngIf="request.search; else noDataDefault">
                Nema rezultata za uneseni pojam.
              </ng-container>
              <ng-template #noDataDefault>Nema pronađenih brendova.</ng-template>
            </div>
          </td>
        </tr>
      </table>
      <app-fit-paginator-bar [vm]="this" />
    </div>
  </div>
</section>
